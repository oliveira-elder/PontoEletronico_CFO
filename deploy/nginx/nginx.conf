# Proxy HTTPS externo → Vite (HTTP interno na rede Docker).
# Acesso:
#   https://ponto.cfo.local/     (porta 443)
#   https://<IP-do-servidor>:12010/

upstream ponto_web {
    server web:12010;
    keepalive 8;
}

server {
    listen 80;
    server_name ponto.cfo.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name ponto.cfo.local;

    ssl_certificate     /etc/nginx/certs/ponto.crt;
    ssl_certificate_key /etc/nginx/certs/ponto.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://ponto_web;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 12010 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/ponto.crt;
    ssl_certificate_key /etc/nginx/certs/ponto.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://ponto_web;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
