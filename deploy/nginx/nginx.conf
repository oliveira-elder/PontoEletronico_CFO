# Proxy HTTPS externo → Vite (HTTP interno na rede Docker).
# Resolver Docker: evita 502 quando o backend sobe depois do nginx.
# Acesso:
#   https://ponto.cfo.org.br/    (porta 443)
#   https://ponto.cfo.local/     (porta 443)
#   https://<IP-do-servidor>:12010/

resolver 127.0.0.11 valid=10s ipv6=off;

# Limite de requisições por IP (proteção contra varredura/abuso). Valores folgados para uso normal.
limit_req_zone $binary_remote_addr zone=ponto_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ponto_verificar:10m rate=5r/s;
limit_req_status 429;

upstream ponto_web {
    server web:12010;
    keepalive 8;
}

upstream ponto_backend {
    server backend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name ponto.cfo.local ponto.cfo.org.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name ponto.cfo.local ponto.cfo.org.br;

    ssl_certificate     /etc/nginx/certs/ponto.crt;
    ssl_certificate_key /etc/nginx/certs/ponto.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cabeçalhos de segurança (CSP não é aplicada: o front usa estilos inline e o Keycloak é embutido).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Verificação pública de documentos: limite mais rígido (sem login).
    location ~ ^/api/ponto/(verificar|verificar-marcacao)(/|$) {
        limit_req zone=ponto_verificar burst=15 nodelay;
        client_max_body_size 2m;
        proxy_pass http://ponto_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        limit_req zone=ponto_api burst=120 nodelay;
        client_max_body_size 15m;
        proxy_pass http://ponto_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://ponto_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Keycloak SSO (include compartilhado)
    include /etc/nginx/keycloak-locations.conf;

    location / {
        proxy_pass http://ponto_web;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

