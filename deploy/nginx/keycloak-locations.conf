# Keycloak SSO via proxy /auth (incluir dentro de cada server { } do nginx)
# Recursos estáticos do tema de login (paths absolutos no HTML do Keycloak)
location ^~ /resources/ {
    proxy_pass http://192.168.100.112:8080/resources/;
    proxy_http_version 1.1;
    proxy_set_header Host 192.168.100.112:8080;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
}

# API SSO — prefixo /auth no host do Ponto
location ^~ /auth/ {
    proxy_pass http://192.168.100.112:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host 192.168.100.112:8080;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_buffering on;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    # Cookies do Keycloak: Path=/realms/ → Path=/auth/realms/
    proxy_cookie_path /realms/ /auth/realms/;
    proxy_cookie_path /resources/ /auth/resources/;
    proxy_redirect http://192.168.100.112:8080/ https://$http_host/auth/;
    proxy_redirect http://sso.cfo.org.br:8080/ https://$http_host/auth/;
    proxy_redirect https://sso.cfo.org.br:8080/ https://$http_host/auth/;
    proxy_redirect http://sso.cfo.org.br:12010/ https://$http_host/auth/;
    proxy_redirect https://sso.cfo.org.br:12010/ https://$http_host/auth/;
    proxy_redirect http://sso.cfo.org.br/ https://$http_host/auth/;
    proxy_redirect https://sso.cfo.org.br/ https://$http_host/auth/;
    sub_filter_once off;
    sub_filter_types application/json application/javascript text/javascript text/html;
    sub_filter "http://sso.cfo.org.br:8080" "https://$http_host/auth";
    sub_filter "https://sso.cfo.org.br:8080" "https://$http_host/auth";
    sub_filter "http://sso.cfo.org.br:12010" "https://$http_host/auth";
    sub_filter "https://sso.cfo.org.br:12010" "https://$http_host/auth";
    sub_filter "http://sso.cfo.org.br" "https://$http_host/auth";
    sub_filter "https://sso.cfo.org.br" "https://$http_host/auth";
    sub_filter "http://192.168.100.112:8080" "https://$http_host/auth";
    sub_filter "https://192.168.100.112:8080" "https://$http_host/auth";
    sub_filter 'src="/resources/' 'src="/auth/resources/';
    sub_filter "src='/resources/" "src='/auth/resources/";
    sub_filter 'href="/resources/' 'href="/auth/resources/';
    sub_filter "href='/resources/" "href='/auth/resources/";
}
