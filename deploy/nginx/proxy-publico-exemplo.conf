# =============================================================================
# Proxy reverso PÚBLICO — ponto.cfo.org.br (189.84.139.67)
# Encaminha TUDO para o servidor interno do Ponto Eletrônico.
#
# Backend (já configurado pela equipe do Ponto):
#   https://192.168.161.50:12010
#
# IMPORTANTE:
#   • NÃO enviar /auth para sso.cfo.org.br — quebra login (cookie não encontrado)
#   • NÃO separar paths em backends diferentes
#   • Preservar Host: ponto.cfo.org.br e cookies (Path=/auth/realms/)
# =============================================================================

upstream ponto_interno {
    server 192.168.161.50:12010;
    keepalive 8;
}

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    server_name ponto.cfo.org.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ponto.cfo.org.br;

    # Certificado público do domínio (Let's Encrypt ou CA interna da TI)
    ssl_certificate     /etc/ssl/certs/ponto.cfo.org.br.crt;
    ssl_certificate_key /etc/ssl/private/ponto.cfo.org.br.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Um único location / — o nginx interno já roteia /api, /auth, /resources, etc.
    location / {
        proxy_pass https://ponto_interno;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket (Vite/dev e notificações)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Não remover nem reescrever cookies do Keycloak
        proxy_pass_header Set-Cookie;
    }
}

# map para WebSocket (incluir no http { } do nginx principal, se ainda não existir):
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# -----------------------------------------------------------------------------
# Paths que DEVEM chegar ao mesmo backend (192.168.161.50:12010):
#   /           → frontend React
#   /api/       → API NestJS
#   /auth/      → Keycloak via proxy interno (SSO)
#   /resources/ → CSS/JS do tema de login Keycloak
#   /uploads/   → arquivos enviados
# -----------------------------------------------------------------------------

# Validação após aplicar (de qualquer máquina com acesso ao domínio):
#   curl -sk https://ponto.cfo.org.br/auth/realms/cfo/.well-known/openid-configuration | head -c 200
# Deve retornar JSON com "issuer":"https://ponto.cfo.org.br/auth/realms/cfo"
# NÃO deve conter sso.cfo.org.br
