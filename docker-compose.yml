# Acesso: https://ponto.cfo.local/ (DNS do AD — registro A ponto.cfo.local)
# Setup: ./scripts/setup-ponto-access.sh && ./scripts/docker-up.sh --build
# Teste: ./scripts/verify-ponto-access.sh
# Nota: use ./scripts/docker-up.sh (ou `docker compose`) — NÃO use o Compose V1
# Python 1.29 (`docker-compose` antigo): quebra com Docker 29 (KeyError ContainerConfig /
# KeyError 'id' em logs -f). Se ainda usa o binário antigo: sudo ./scripts/fix-compose-v1-keyerror.sh

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pontoeletronico
      POSTGRES_PASSWORD: pontoeletronico
      POSTGRES_DB: pontoeletronico
    ports:
      - "12001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontoeletronico -d pontoeletronico"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - sed -i 's/\r$$//' /app/docker/backend-entrypoint.sh && exec sh /app/docker/backend-entrypoint.sh
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://pontoeletronico:pontoeletronico@postgres:5432/pontoeletronico
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://192.168.100.112:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://192.168.100.112:8080/realms/cfo}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://192.168.100.112:8080/realms/cfo/protocol/openid-connect/certs}
      KEYCLOAK_JWKS_FILE: /app/deploy/keycloak/jwks.json
      KEYCLOAK_JWKS_TLS_INSECURE: "true"
      KEYCLOAK_VALIDATE_ISSUER: "false"
      KEYCLOAK_AUDIENCE: pontoeletronico-dev
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pontoeletronico-dev}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_SERVICE_CLIENT_ID: ${KEYCLOAK_SERVICE_CLIENT_ID:-}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:-}
      JWT_SECRET: dev-secret
      GLPI_BASE_URL: http://glpi.local
      VIDEO_CONFERENCE_ENABLED: "false"
      SUPER_ADMIN_USERNAMES: ${SUPER_ADMIN_USERNAMES:-elder.oliveira}
      # MonitorSistema — ingestão de logs e backup (carregado do .env da raiz)
      INGEST_SHARED_KEY: ${INGEST_SHARED_KEY:-}
      BACKUP_AGENT_SHARED_KEY: ${BACKUP_AGENT_SHARED_KEY:-}
      MONITOR_INGEST_PUSH_URL: ${MONITOR_INGEST_PUSH_URL:-}
      MONITOR_AUDIT_INGEST_ENABLED: ${MONITOR_AUDIT_INGEST_ENABLED:-true}
      MONITOR_SERVICE_NAME: ${MONITOR_SERVICE_NAME:-api-ponto}
      MONITOR_ENVIRONMENT: ${MONITOR_ENVIRONMENT:-prod}
      API_PUBLICA_SYSTEM_KEY: ${API_PUBLICA_SYSTEM_KEY:-ponto-eletronico-cfo}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://192.168.161.50:12003/api}
      BACKUP_STORAGE_PATH: ${BACKUP_STORAGE_PATH:-/data/backups}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
      BACKUP_PG_DUMP_FORMAT: ${BACKUP_PG_DUMP_FORMAT:-plain}
      BACKUP_ARTIFACT_BASENAME: ${BACKUP_ARTIFACT_BASENAME:-backup_sst}
      # API de Ramais (nova integração — token carregado do .env da raiz)
      SECTIONS_INTEGRATION_URL: ${SECTIONS_INTEGRATION_URL:-https://192.168.161.50:11010/api/sections/integration/users}
      SECTIONS_INTEGRATION_TOKEN: ${SECTIONS_INTEGRATION_TOKEN:-}
      # Credenciais da API Admin do Keycloak (lista usuários/grupos do AD para seed no banco).
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # URL pública do frontend — links de atalho em e-mails/notificações
      APP_BASE_URL: ${APP_BASE_URL:-https://ponto.cfo.org.br}
      VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-https://ponto.cfo.org.br}
    volumes:
      - ./:/app
      - node_modules_root:/app/node_modules
      # Usa packages/backend/dist do host (evita volume nomeado com build antigo)
      - uploads_fotos:/app/uploads
      - ./deploy/keycloak:/app/deploy/keycloak:ro
    ports:
      - "12003:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          node -e "
            require('http').get('http://127.0.0.1:3000/api/auth/me', r => {
              process.exit(r.statusCode ? 0 : 1);
            }).on('error', () => process.exit(1));
          "
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - sed -i 's/\r$$//' /app/docker/web-entrypoint.sh && exec sh /app/docker/web-entrypoint.sh
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_BEHIND_PROXY: "true"
      VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-https://ponto.cfo.org.br}
      VITE_API_TARGET: http://backend:3000
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://192.168.100.112:8080}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://ponto.cfo.org.br/auth}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-cfo}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-pontoeletronico-dev}
      VITE_SUPER_ADMIN_USERNAMES: ${VITE_SUPER_ADMIN_USERNAMES:-elder.oliveira}
    volumes:
      - ./:/app
      - node_modules_root:/app/node_modules
    expose:
      - "12010"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "12010:12010"
      # IPv4 explícito — evita conflito com bind órfão só em [::]:443
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/keycloak-locations.conf:/etc/nginx/keycloak-locations.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        if [ ! -f /etc/nginx/certs/ponto.crt ]; then
          echo 'Certificado ausente. Execute no host: ./scripts/setup-ponto-access.sh';
          exit 1;
        fi;
        nginx -g 'daemon off;'
      "

  # Resolve ponto.cfo.local para clientes que usam ESTE servidor como DNS (config DHCP).
  dns:
    image: coredns/coredns:1.11.1
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./deploy/dns/generated:/etc/coredns:ro
    command: -conf /etc/coredns/Corefile
    restart: unless-stopped
    profiles:
      - dns

volumes:
  postgres_data:
  uploads_fotos:
  node_modules_root:
