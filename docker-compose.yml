version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intranet
      POSTGRES_PASSWORD: intranet
      POSTGRES_DB: intranet
    ports:
      - "11001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/intranet
      KC_DB_USERNAME: intranet
      KC_DB_PASSWORD: intranet
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "11002:8080"
    depends_on:
      - postgres

  backend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @intranet/backend"
    environment:
      DATABASE_URL: postgresql://intranet:intranet@postgres:5432/intranet
      KEYCLOAK_ISSUER: http://localhost:11002/realms/intranet
      KEYCLOAK_AUDIENCE: intranet-api
      JWT_SECRET: dev-secret
      GLPI_BASE_URL: http://glpi.local
      VIDEO_CONFERENCE_ENABLED: "false"
    volumes:
      - ./:/app
    ports:
      - "11003:3000"
    depends_on:
      - postgres
      - keycloak

volumes:
  postgres_data:
