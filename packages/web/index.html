<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ponto Eletrônico — CFO</title>
    <meta name="description" content="Sistema de Controle de Frequência — Conselho Federal de Odontologia" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Pré-conecta aos servidores de fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Instrument Serif (display) + JetBrains Mono (código) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Geist (corpo) via jsDelivr -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css"
    />

    <!-- Enquanto o JS da SPA não monta (#root vazio), mostra spinner — evita “tela branca” no retorno do SSO. -->
    <style>
      html, body { margin: 0; background: #fbf8f4; }
      #root:empty {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::after {
        content: "";
        width: 36px;
        height: 36px;
        border: 3px solid #eadfd0;
        border-top-color: #7a1e26;
        border-radius: 50%;
        animation: ponto-boot-spin 0.8s linear infinite;
      }
      @keyframes ponto-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
